apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: ai-tos
  labels:
    app: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ai-tos/ai-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-tos-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: ai-tos
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
