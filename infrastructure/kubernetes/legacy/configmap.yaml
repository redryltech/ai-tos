apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-tos-config
  namespace: ai-tos
data:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://ai-tos-redis:6379"
  DATABASE_URL: "postgresql://ai_tos:CHANGE_ME@ai-tos-db:5432/ai_tos"
  CORS_ORIGIN: "https://ai-tos.example.com"
  NEXT_PUBLIC_API_URL: "https://api.ai-tos.example.com"
  AI_SERVICE_URL: "http://ai-service:8000"
