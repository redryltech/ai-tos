apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-tos-ingress
  namespace: ai-tos
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: ai-tos.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
