apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ai-tos
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ai-tos/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ai-tos-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ai-tos
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
