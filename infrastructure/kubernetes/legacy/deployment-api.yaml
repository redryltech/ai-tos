apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-tos
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ai-tos/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: ai-tos-config
            - secretRef:
                name: ai-tos-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-tos
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
