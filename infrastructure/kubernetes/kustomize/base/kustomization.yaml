apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base = rendered Helm chart. Environments patch via overlays (ADR-0007).
# Render with: kustomize build --enable-helm .  (or `helm template` then kustomize)
helmCharts:
  - name: ai-tos
    path: ../../helm/ai-tos
    releaseName: ai-tos
    valuesFile: values-base.yaml
