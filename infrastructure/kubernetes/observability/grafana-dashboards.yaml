# Grafana dashboards-as-code (platform SLO / health)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  platform-health.json: |
    {
      "uid": "ai-tos-platform-health",
      "title": "AI-TOS Platform Health",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["ai-tos", "platform"],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP request rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count[5m])) by (service)",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP error rate (5xx)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{status=~\"5..\"}[5m])) by (service) / sum(rate(http_server_request_duration_seconds_count[5m])) by (service)",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p99 latency",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "OTel Collector export failures",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(otelcol_exporter_send_failed_spans_total[5m])) or vector(0)",
              "legendFormat": "failed spans"
            }
          ]
        }
      ]
    }
