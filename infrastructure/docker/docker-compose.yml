# Local Phase 0 stack. Build context is the repo root (../../).
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai-tos
      POSTGRES_PASSWORD: ai-tos
      POSTGRES_DB: ai_tos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai-tos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://ai-tos:ai-tos@postgres:5432/ai_tos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-insecure-change-me
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  ai-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ai-service
    ports:
      - "8000:8000"

  market-worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.go
      args:
        WORKER: market-worker
    ports:
      - "4100:4100"

  risk-worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.go
      args:
        WORKER: risk-worker
    ports:
      - "4200:4200"

  news-worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.go
      args:
        WORKER: news-worker
    ports:
      - "4300:4300"

  scheduler:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.go
      args:
        WORKER: scheduler
    ports:
      - "4400:4400"

  # --- Observability (Phase 0B.6 / ADR-0010) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"

  prometheus:
    image: prom/prometheus:v2.51.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4319:4317"

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pgdata:
  promdata:
  grafanadata:
