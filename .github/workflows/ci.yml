name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Contract & unit tests
        run: pnpm run test

      - name: Health contract check (shared types / OpenAPI)
        run: |
          # Phase 0A: ensure @ai-tos/shared contracts compile and API spec is present.
          pnpm --filter @ai-tos/shared typecheck
          test -f apps/api/src/main.ts || (echo "API entry missing"; exit 1)

      - name: Python syntax check
        run: find apps/ai-service -name "*.py" -print0 | xargs -0 python3 -m py_compile

      - name: Go vet
        run: |
          for d in apps/*/; do
            if [ -f "$d/go.mod" ]; then
              (cd "$d" && go vet ./...)
            fi
          done
