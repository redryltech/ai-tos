[project]
name = "ai-tos-ai-service"
version = "0.0.0"
description = "AI-TOS AI Service (LangGraph/LangChain ready). Phase 0: adapter interfaces only."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "openai>=1.30.0",
  "google-generativeai>=0.5.0",
  "anthropic>=0.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.core", "app.providers", "app.routers"]
